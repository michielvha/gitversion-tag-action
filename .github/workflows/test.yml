name: Test action

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: shellcheck scripts/*.sh
      - name: Install the pinned GitVersion for history tests
        run: node scripts/install-test-gitversion.mjs
      - run: npm test
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Run the composite action without a caller config
        id: version
        uses: ./
        with:
          dry-run: 'true'
      - name: Verify outputs and clean checkout
        shell: bash
        env:
          SEMVER: ${{ steps.version.outputs.semVer }}
          FULL_SEMVER: ${{ steps.version.outputs.FullSemVer }}
          TAGGED: ${{ steps.version.outputs.tagged }}
          SKIP_REASON: ${{ steps.version.outputs.skip-reason }}
        run: bash scripts/verify-smoke.sh