name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview without creating a tag or release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  release:
    needs: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    uses: vhco-pro/gh-release-workflow/.github/workflows/gh-release.yml@b18de6d2f305f971afe01ba31e17bde5966b1567 # v0.1.1
    with:
      dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) }}