name: Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview without creating a tag or release
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/test.yml
  release:
    needs: verify
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    uses: vhco-pro/.github/.github/workflows/reusable-release.yml@71c23eca08025fe691b4e0696f2f1cda02b20587 # v1.1.0
    with:
      workflow-ref: 71c23eca08025fe691b4e0696f2f1cda02b20587
      dry-run: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry-run) }}